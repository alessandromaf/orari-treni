<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#1557b0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Train body -->
  <rect x="136" y="100" width="240" height="280" rx="32" fill="white" opacity="0.95"/>
  <!-- Windows -->
  <rect x="168" y="140" width="176" height="60" rx="12" fill="#1a73e8" opacity="0.2"/>
  <rect x="168" y="220" width="176" height="60" rx="12" fill="#1a73e8" opacity="0.2"/>
  <!-- Headlights -->
  <circle cx="200" cy="330" r="18" fill="#1a73e8"/>
  <circle cx="312" cy="330" r="18" fill="#1a73e8"/>
  <!-- Rails -->
  <rect x="100" y="400" width="312" height="8" rx="4" fill="white" opacity="0.6"/>
  <rect x="120" y="420" width="272" height="8" rx="4" fill="white" opacity="0.4"/>
  <!-- Speed lines -->
  <rect x="60" y="160" width="48" height="4" rx="2" fill="white" opacity="0.5"/>
  <rect x="40" y="200" width="64" height="4" rx="2" fill="white" opacity="0.4"/>
  <rect x="52" y="240" width="52" height="4" rx="2" fill="white" opacity="0.3"/>
</svg>
